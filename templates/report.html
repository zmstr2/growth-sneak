<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'sha256-{{SCRIPT_HASH}}'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
<title>{{TITLE}}</title>
<style>
/* Surfaces, from the back to the front. One rule: white is for what you read or inspect, gray is for structure.
   --bg       the page: only the section headings and the account chips sit directly on it
   --panel    white: the one card level (an activity, or the traffic, tech and gaps panels) and what is
              drawn like the original inside it (posts, ads, tables, screenshots, with a hairline)
   --surface  a light tint on white: tiles, pills, table headers, media wells
   --surface-deep  the tint pressed or emphasised: hover, badges, state pills
   Ink is near-black; colour is kept for platform marks and the traffic chart. */
:root{
  --bg:#eeeef0;
  --panel:#ffffff;
  --surface:#f4f4f6;
  --surface-deep:#e8e8ec;
  --rail:#f8f8fa;
  --ink:#101010;
  --ink-head:#242424;
  --ink-2:#4b4b4b;
  --muted:#6b6b6b;
  --ink-4:#a1a1a1;
  --line:#e2e2e7;
  --line-2:#eeeef2;
  --line-strong:#d6d6d6;
  --grid:#ececec;
  --accent:#242424;
  --hi:#15803d; --hi-soft:#f1f8f3; --hi-line:#cfe8d6;
  --mid:#4b4b4b; --mid-soft:#f5f5f5;

  --t1:.8125rem; --t2:.9375rem; --t3:1.0625rem; --t4:1.25rem; --t45:1.75rem; --t5:2rem;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Inter',ui-monospace,monospace;
  --head:'Bricolage Grotesque','Inter',sans-serif;
  --r:8px; --r-xl:12px; --r-2xl:16px; --r-pill:9999px;
  --shadow:0 1px 2px rgba(16,16,16,.04),0 8px 24px -12px rgba(16,16,16,.10);
  --shadow-float:0 2px 4px rgba(16,16,16,.05),0 18px 40px -16px rgba(16,16,16,.18);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font:400 var(--t2)/1.6 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:600;line-height:1.2;text-wrap:balance;color:var(--ink-head)}
h1{font-size:var(--t5);letter-spacing:-.02em}
h2{font-size:var(--t4);letter-spacing:-.02em;margin-bottom:1rem}
h3{font-size:var(--t3);letter-spacing:-.01em;margin:2.25rem 0 .5rem}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding:0}
a{color:inherit;text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
a:hover{text-decoration-color:currentColor}
.ext span{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:var(--t2);margin-top:.25rem}

/* Layout: a fixed contents list on the left, the report on the right. */
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
.shell{max-width:1360px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:176px minmax(0,1fr);gap:40px;align-items:start}
.rail{position:sticky;top:0;align-self:start;padding:56px 0 32px;max-height:100vh;overflow-y:auto}
.rail ol{list-style:none;display:flex;flex-direction:column;gap:2px;margin:0;padding:0;border-left:1px solid var(--line-strong)}
.rail a{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0 7px 16px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:var(--t2);line-height:1.35}
.rail a:hover{color:var(--ink)}
.rail a[aria-current="true"]{color:var(--ink);font-weight:600;border-left-color:var(--ink)}
#report{min-width:0;max-width:1120px;padding:56px 0 72px}
#report>*+*{margin-top:56px}
.block{scroll-margin-top:2rem}
.skip{position:fixed;top:12px;left:12px;z-index:30;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-pill);font-size:var(--t1);font-weight:600;text-decoration:none;transform:translateY(-64px);transition:transform .18s var(--ease)}
.skip:focus-visible{transform:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Hero: the brand, how they grow, their strongest plays */
.brand{display:flex;align-items:center;gap:20px}
.logo{width:56px;height:56px;border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:6px;object-fit:contain;flex:none}
.brand h1{font-family:var(--head);font-weight:600;font-size:clamp(2rem,3vw,2.5rem);line-height:1.1;letter-spacing:-.025em;margin:0}
.meta{margin-top:4px;font-size:var(--t1);color:var(--muted)}
.note{margin-top:1.25rem;font-size:var(--t1);color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:.6rem .85rem}

/* Sections */
.block>h2{font-family:var(--head);font-weight:600;font-size:var(--t45);letter-spacing:-.02em;color:var(--ink-head);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--shadow);padding:24px 26px}

/* An activity: a shaded panel inside its section card. Name and a state pill on one line, one sentence, then the proof full width. */
.alist{display:flex;flex-direction:column;gap:12px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--shadow);padding:24px 26px;display:flex;flex-direction:column;gap:16px;min-width:0;scroll-margin-top:2rem}
.act.un{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 16px;padding:14px 20px;background:transparent;border:1px dashed var(--line-strong);box-shadow:none}
.act.un .ahead h3{font-size:var(--t2);color:var(--ink-2)}
.act.un .aread{font-size:var(--t1);margin-left:auto}
.ahead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.ahead h3{margin:0;font-size:var(--t3);letter-spacing:-.01em;line-height:1.3}
.state{font-size:var(--t1);font-weight:600;line-height:1;padding:5px 10px;border-radius:var(--r-pill);background:var(--surface-deep);color:var(--ink-2)}
.state-none{background:transparent;color:var(--muted);font-weight:500;padding:0}
.state-absent{background:var(--surface);border:1px solid var(--line-strong)}
.aread{margin:0;font-size:var(--t3);line-height:1.5;color:var(--ink);font-weight:500;max-width:66ch;text-wrap:pretty}
.aread.muted{font-weight:400;color:var(--muted)}
.act>.strip{margin:0}

/* Key facts: small tiles, label over value */
.kf{margin:0;display:flex;flex-wrap:wrap;gap:8px}
.kf>div{flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:var(--surface);border-radius:12px;font-size:var(--t2);line-height:1.45}
.kf>div.w{flex-basis:100%}
.kf dt{font-size:var(--t1);font-weight:500;color:var(--muted)}
.kf dd{margin:0;color:var(--ink)}
.kf dd b{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lpill{display:inline-flex;padding:4px 11px;border-radius:var(--r-pill);background:var(--surface-deep);color:var(--ink);text-decoration:none;font-size:var(--t1);font-weight:500}
.lpill:hover{background:var(--line)}
.sm{display:block;margin-top:4px;font-size:var(--t1)}

/* Sources: small pills, only where the examples do not link to the originals */
.srcline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:var(--t1);color:var(--muted)}
.slab{margin-right:4px;font-weight:500}
.schip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.schip:hover{background:var(--surface-deep);color:var(--ink)}

/* Accounts: one compact chip each */
.chans{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chan{display:flex;align-items:center;gap:10px;padding:7px 16px 7px 7px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-decoration:none;color:inherit;min-width:0;transition:background .15s var(--ease),border-color .15s var(--ease)}
.chan:hover{border-color:var(--ink-4)}
.cmark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--ink);color:#fff;flex:none}
.cm-linkedin{background:#0a66c2}
.cm-youtube{background:#e1002d}
.cm-instagram{background:#c13584}
.cm-tiktok{background:#111}
.ctext{display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.2}
.chandle{font-size:var(--t2);font-weight:600;color:var(--ink);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{display:flex;align-items:center;gap:8px;font-size:var(--t1);color:var(--ink-2);white-space:nowrap}
.cmeta b{font-weight:600;color:var(--ink)}
.cown{font-size:.75rem;line-height:1;padding:3px 8px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2)}
.note-s{font-size:var(--t1);color:var(--muted);margin:0}
.inl{margin:0}

/* Pieces of content: a plain table, newest first */
.tgrid{display:flex;flex-direction:column;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.egrid{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:var(--t2)}
.egrid th{text-align:left;font-size:var(--t1);font-weight:500;color:var(--muted);padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.egrid td{padding:11px 14px;border-top:1px solid var(--line-2);vertical-align:top;line-height:1.4}
.egrid tbody tr:first-child td{border-top:0}
.egrid td.ek{width:1%;white-space:nowrap}
.egrid td.et{color:var(--ink)}
.egrid td.et a{font-weight:600;text-decoration:none}
.egrid td.et a:hover{text-decoration:underline}
.egrid td.eo{color:var(--ink-2);white-space:nowrap}
.egrid td.ed{white-space:nowrap;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kind{display:inline-block;padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-deep);color:var(--ink-2);font-size:var(--t1);font-weight:500;line-height:1.2}
.kind.soon{background:var(--hi-soft);color:var(--hi);margin-left:4px}

/* Review-site ratings */
.rates{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.rate{display:flex;align-items:baseline;gap:8px;padding:9px 14px;background:var(--surface);border-radius:12px;text-decoration:none;color:var(--ink)}
a.rate:hover{background:var(--surface-deep)}
.rate b{font-family:var(--head);font-size:1.375rem;font-weight:600;line-height:1}
.rsrc{font-weight:600;font-size:var(--t2)}
.rcount{font-size:var(--t1);color:var(--muted)}

/* Traffic chart */
.tsum{font-size:var(--t3);margin:0 0 12px;max-width:60ch}
.tsum b{font-weight:600}
.tchart{display:block;width:100%;height:auto;max-width:720px;margin:8px 0 4px;overflow:visible}
.tchart .tg{stroke:var(--line);stroke-width:1}
.tchart .tl{font:12px var(--font);fill:var(--muted)}
.tchart .tv{font:600 12px var(--font);fill:var(--ink)}
.tchart .ta{fill:var(--hi);opacity:.08}
.tchart .tline{fill:none;stroke:var(--hi);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.tchart .td{fill:var(--panel);stroke:var(--hi);stroke-width:2.5}

/* Plain facts, tool chips and the closing "what we could not see" lines */
.facts{font-size:var(--t2);color:var(--ink-2);margin:0;line-height:1.6}
.facts b{color:var(--ink);font-weight:600}
.facts.muted{color:var(--muted);font-size:var(--t1)}
.chips{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0;margin:0 0 4px}
.chips li{padding:10px 14px;background:var(--surface);border-radius:12px;font-weight:500;font-size:var(--t2);color:var(--ink)}
.gapline{margin:1rem 0 10px;font-size:var(--t2);color:var(--ink-2)}
.gapline b{color:var(--ink)}
.gapl{margin-top:10px;color:var(--ink-2);font-size:var(--t2)}
.plain{list-style:none}
.plain li{padding:.25rem 0}

/* Posts that look like the platform they came from */
.xpost.nat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.strip-item .xpost.nat{background:var(--panel)}
.nat header{display:flex;align-items:center;gap:10px}
.nat .av{width:44px;height:44px;border-radius:50%;background:#e2e2e2;color:#555;display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.nat .who{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.nat .who b{font-size:var(--t2);color:var(--ink);overflow-wrap:anywhere}
.nat .sub{font-size:var(--t1);color:var(--muted)}
.nat .plat{margin-left:auto;flex:none;width:22px;height:22px;display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1}
.nat .plat-li{background:#0a66c2;color:#fff;border-radius:4px}
.nat .plat-x{background:#000;color:#fff;border-radius:50%}
.nat blockquote{margin:0;font-size:var(--t2);line-height:1.45;color:#1d1d1d;white-space:pre-line;overflow-wrap:anywhere}
.nat .xnums{display:flex;gap:22px;align-items:center}
.nat.li .xnums{padding-top:8px;border-top:1px solid var(--line-2)}
.nat .m{display:inline-flex;align-items:center;gap:6px;font-size:var(--t1);color:var(--muted)}
.nat .m b{font-weight:500;color:inherit;font-size:var(--t1)}
.nat .mi{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nat footer{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--t1)}
.nat.li footer{border-top:1px solid var(--line-2);padding-top:8px}
.nat .acts{display:flex;gap:16px;font-weight:600;color:var(--muted);font-size:var(--t1)}
.mthumb{height:260px!important}
.mthumb img{max-height:240px!important;max-width:100%}
.xpost.withthumb .pthumb{display:block;border-radius:8px;overflow:hidden;background:var(--surface)}
.xpost.withthumb .pthumb img{display:block;width:100%;max-height:200px;object-fit:cover}

/* Examples: a row you scroll sideways */
.strip{margin:0}
.strip-head{display:flex;align-items:center;justify-content:space-between;font-size:var(--t1);font-weight:500;color:var(--muted);margin-bottom:10px;min-height:32px}
.strip-nav{display:inline-flex;gap:6px}
.strip-nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font:inherit;font-size:1.1rem;line-height:1;cursor:pointer}
.strip-nav button:hover{background:var(--surface)}
.strip-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:12px;scrollbar-width:thin}
.strip-item{flex:0 0 min(290px,82%);scroll-snap-align:start;min-width:0}
.strip-item.shot{flex-basis:min(340px,84%)}
.strip-item .xpost{height:100%;background:var(--panel);border:1px solid var(--line)}
.strip-item .thumb{background:var(--surface)}
.strip-item .xpost blockquote{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.strip-item .xad .thumb{height:200px}
.strip-item.nativead{flex-basis:min(310px,86%);display:flex;flex-direction:column}
.nad{display:flex;flex-direction:column;height:100%}
.nad-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:1}
.nad-top{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.nad-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface)}
.nad-ini{display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink-2);font-size:var(--t2)}
.nad-who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.nad-who b{font-size:var(--t2);color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nad-who span{font-size:var(--t1);color:var(--muted)}
.nad-text{margin:0 0 10px;padding:0 14px;font-size:var(--t2);line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.nad-media{display:flex;align-items:center;justify-content:center;background:var(--surface);text-decoration:none;color:var(--ink-2)}
.nad-media img{display:block;width:100%;max-height:340px;object-fit:contain}
.nad-video{flex-direction:column;gap:6px;min-height:200px;font-size:var(--t2)}
.nad-play{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:2px solid var(--ink-4);color:var(--ink-2);font-size:1.1rem;padding-left:3px}
.nad-watch{font-size:var(--t1);color:var(--muted)}
.nad-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel);margin-top:auto}
.nad-meta{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.nad-dom{font-size:.6875rem;letter-spacing:.02em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nad-meta b{font-size:var(--t2);color:var(--ink);font-weight:600}
.nad-desc{font-size:var(--t1);color:var(--muted)}
.nad-cta{flex:none;padding:7px 12px;border-radius:6px;background:var(--surface);color:var(--ink);font-size:var(--t1);font-weight:600;border:1px solid var(--line)}

.strip-item .frame{border-color:var(--line)}

/* Claims and their inline sources */
.st{color:var(--muted);font-size:var(--t1);margin-left:.15rem}

/* Ad previews */
.thumb{display:flex;align-items:center;justify-content:center;height:170px;padding:10px;background:var(--surface);border-radius:10px;overflow:hidden;text-decoration:none}
.thumb img{max-width:100%;max-height:150px;object-fit:contain;border-radius:3px}
.xad figcaption{margin-top:.55rem;font-size:var(--t2);color:var(--muted)}
.xad figcaption b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* Lead sections are larger */
#gaps h2{font-size:var(--t45);letter-spacing:-.015em}

/* Type that points: figures sit in a quiet highlighter */

/* Exhibits: posts, ads and page screenshots, always with a link to the original */
.xpost{background:var(--surface);border-radius:12px;padding:.9rem 1rem;display:grid;gap:.65rem;font-size:var(--t2);align-content:start}
.xpost header{display:flex;flex-wrap:wrap;gap:.2rem .55rem;align-items:center}
.xwho{min-width:0;overflow-wrap:anywhere}
.pmark{display:inline-grid;place-items:center;width:1.65rem;height:1.65rem;border-radius:6px;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;letter-spacing:0;flex:none}
.pm-x{background:var(--ink)}
.xplat{margin-left:auto;color:var(--muted);font-size:var(--t1)}
.xpost blockquote{margin:0;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.xpost footer{display:flex;flex-wrap:wrap;gap:.3rem 1rem;justify-content:space-between;align-items:baseline;font-size:var(--t1);color:var(--ink-2)}
.xnums{display:flex;flex-wrap:wrap;gap:.1rem .9rem}
.xnums b{font-size:var(--t3);font-variant-numeric:tabular-nums;color:var(--ink)}
.xad{margin:0}
.thumb.textad{padding:1rem}
.thumb.textad span{font-size:var(--t2);line-height:1.4;text-align:center;color:var(--ink-2)}
.xshot{margin:0}
.frame{display:block;width:100%;padding:0;font:inherit;color:inherit;text-align:left;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--bg);text-decoration:none;cursor:zoom-in}
.frame:hover{border-color:var(--ink-2)}
.fbar{display:flex;align-items:center;gap:5px;padding:.4rem .6rem;background:var(--surface);border-bottom:1px solid var(--line)}
.fbar{min-width:0;overflow:hidden}
.fbar em{min-width:0;font-style:normal;font-size:var(--t1);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.k-signup .frame img{aspect-ratio:16/7;object-position:50% 40%}
.k-pricing .frame img{aspect-ratio:16/9}
.noimg{display:grid;place-items:center;aspect-ratio:16/10;color:var(--muted);font-size:var(--t2)}
.xshot figcaption{margin-top:.6rem;font-size:var(--t2);color:var(--ink-2)}
.xshot figcaption b{color:var(--ink);font-weight:600}

/* Enlarged screenshot */
.zoom{border:0;padding:0;max-width:min(96vw,80rem);max-height:94vh;background:var(--bg);color:var(--ink);border-radius:12px;overflow:auto}
.zoom::backdrop{background:rgba(16,16,16,.72)}
.zoom img{display:block;width:100%;height:auto}
.zoom{-webkit-overflow-scrolling:touch}
.zclose{position:sticky;top:.5rem;float:right;margin:.5rem;z-index:2;font:inherit;font-size:var(--t2);background:var(--bg);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:.4rem .8rem;cursor:pointer}

/* AI-search readiness checklist: one small tile per check */
.ck{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.ck li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--surface);border-radius:12px;font-size:var(--t2);line-height:1.4}
.gl{display:inline-grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;font-size:var(--t1);flex:none;line-height:1;margin-top:.1rem}
.gl-yes{background:var(--hi);color:#fff}
.gl-no{border:1.5px solid var(--ink-4);color:var(--muted)}
.gl-unknown{border:1.5px dashed var(--line-strong);color:var(--muted)}
.ckt{display:flex;flex-direction:column;gap:1px;min-width:0}
.ck b{color:var(--ink);font-weight:600}
.ckd{font-size:var(--t1);color:var(--muted);overflow-wrap:anywhere}

/* Captions */
.hl{display:block;margin-top:.2rem;color:var(--ink-2);font-size:var(--t1);line-height:1.4}

/* Footer */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  #report{padding:32px 0 56px}
  .panel,.act{padding:16px}
  .chandle{max-width:150px}
}
@media (max-width:720px){
  .shell{padding:0 12px}
  .hero{padding:40px 16px 0}
  .zoom{max-width:100vw;max-height:100vh;border-radius:0}
  .zoom img{width:240%;max-width:none}
  .thumb{height:130px}
  .thumb img{max-height:110px}
}
@media print{
  :root{--bg:#fff;--surface:#f2f2f2;--ink:#111;--ink-2:#333;--muted:#555;--line:#ddd;--line-strong:#aaa;--accent:#111}
  .rail,.skip,.zclose{display:none!important}
  .xpost,.xshot,.xad{break-inside:avoid}
  .ext[href^="http"]::after{content:" (" attr(href) ")";font-size:.7em;color:#555;word-break:break-all}
  .frame{cursor:auto}
  body{font-size:11pt}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
{{BODY}}
<dialog id="zoom" class="zoom" aria-label="Enlarged screenshot"><button class="zclose" type="button" id="zclose">Close</button><img alt="" id="zimg"></dialog>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* Enlarge a screenshot. The dialog gives Esc, focus trapping and focus return for free. */
  var dlg = $('#zoom'), zimg = $('#zimg');
  if (dlg && typeof dlg.showModal === 'function') {
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-zoom]');
      if (!b) return;
      var img = $('img', b);
      if (!img) return;
      zimg.src = img.src; zimg.alt = img.alt;
      dlg.showModal();
    });
    $('#zclose').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  }

  /* The section bar marks where you are. */
  var links = $$('.rail a'), spy = [];
  links.forEach(function (a) { var el = document.getElementById(a.getAttribute('href').slice(1)); if (el) spy.push([a, el]); });
  if (spy.length && 'IntersectionObserver' in window) {
    var current = null;
    var mark = function () {
      var y = window.innerHeight * 0.3, best = null;
      spy.forEach(function (p) { var r = p[1].getBoundingClientRect(); if (r.top <= y) best = p[0]; });
      if (best !== current) {
        links.forEach(function (a) { a.removeAttribute('aria-current'); });
        if (best) { best.setAttribute('aria-current', 'true'); if (best.scrollIntoView && best.parentNode.scrollWidth > best.parentNode.clientWidth) best.parentNode.scrollTo({ left: best.offsetLeft - 20, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
        current = best;
      }
    };
    window.addEventListener('scroll', mark, { passive: true });
    mark();
  }

  /* Example rows scroll sideways; the arrows move one screenful. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.strip-nav button');
    if (!b) return;
    var track = $('.strip-track', b.closest('.strip'));
    track.scrollBy({ left: Number(b.dataset.dir) * track.clientWidth * 0.85, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
})();
</script>
</body>
</html>
